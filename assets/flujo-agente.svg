<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-labelledby="tituloFlujo descFlujo">
  <title id="tituloFlujo">Flujo del agente en seis pasos alternos</title>
  <desc id="descFlujo">Tres columnas con dos cajas cada una: arriba los pasos 1, 3 y 5; abajo los pasos 2, 4 y 6, unidos por flechas curvas.</desc>

  <defs>
    <filter id="sombraCaja" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#181612" flood-opacity="0.14"/>
    </filter>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#181612"/>
    </marker>
    <style>
      .caja   { fill: #ffffff; stroke: #181612; stroke-width: 1.5; }
      .num    { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
      .tit    { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 26px; font-weight: 700; fill: #181612; letter-spacing: -.3px; }
      .det    { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; fill: #5b564d; }
      .flecha { fill: none; stroke: #181612; stroke-width: 2.8; stroke-linecap: round; }
      .nota   { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #b45309; }
    </style>
  </defs>

  <!-- ============ CAJAS ============ -->
  <g filter="url(#sombraCaja)">
    <!-- Fila superior: 1 - 3 - 5 -->
    <rect class="caja" x="45"  y="16" width="340" height="134" rx="12"/>
    <rect class="caja" x="430" y="16" width="340" height="134" rx="12"/>
    <rect class="caja" x="815" y="16" width="340" height="134" rx="12"/>
    <!-- Fila inferior: 2 - 4 - 6 -->
    <rect class="caja" x="45"  y="276" width="340" height="134" rx="12"/>
    <rect class="caja" x="430" y="276" width="340" height="134" rx="12"/>
    <rect class="caja" x="815" y="276" width="340" height="134" rx="12"/>
  </g>

  <!-- ============ NÚMEROS ============ -->
  <g>
    <circle cx="75"  cy="44" r="15" fill="#c4472e"/><text class="num" x="75"  y="50" text-anchor="middle">1</text>
    <circle cx="460" cy="44" r="15" fill="#c4472e"/><text class="num" x="460" y="50" text-anchor="middle">3</text>
    <circle cx="845" cy="44" r="15" fill="#c4472e"/><text class="num" x="845" y="50" text-anchor="middle">5</text>
    <circle cx="75"  cy="304" r="15" fill="#c4472e"/><text class="num" x="75"  y="310" text-anchor="middle">2</text>
    <circle cx="460" cy="304" r="15" fill="#c4472e"/><text class="num" x="460" y="310" text-anchor="middle">4</text>
    <circle cx="845" cy="304" r="15" fill="#c4472e"/><text class="num" x="845" y="310" text-anchor="middle">6</text>
  </g>

  <!-- ============ TEXTOS ============ -->
  <g>
    <text class="tit" x="63" y="100">Pregunta</text>
    <text class="det" x="63" y="122">el usuario pregunta en</text>
    <text class="det" x="63" y="140">lenguaje natural</text>

    <text class="tit" x="448" y="100">Esquema</text>
    <text class="det" x="448" y="122">tablas, campos</text>
    <text class="det" x="448" y="140">y ejemplos</text>

    <text class="tit" x="833" y="100">Ejecución</text>
    <text class="det" x="833" y="122">en el motor real</text>

    <text class="tit" x="63" y="360">Razonamiento</text>
    <text class="det" x="63" y="382">elige qué herramienta</text>
    <text class="det" x="63" y="400">usar</text>

    <text class="tit" x="448" y="360">Consulta</text>
    <text class="det" x="448" y="382">SQL o pipeline</text>
    <text class="det" x="448" y="400">de MongoDB</text>

    <text class="tit" x="833" y="360">Respuesta</text>
    <text class="det" x="833" y="382">datos interpretados</text>
    <text class="det" x="833" y="400">y formateados</text>
  </g>

  <!-- ============ FLECHAS CURVAS ============ -->
  <g>
    <path class="flecha" marker-end="url(#punta)" d="M215 150 C242 185, 215 232, 215 272"/>
    <path class="flecha" marker-end="url(#punta)" d="M385 343 C428 343, 387 83, 426 83"/>
    <path class="flecha" marker-end="url(#punta)" d="M600 150 C627 185, 600 232, 600 272"/>
    <path class="flecha" marker-end="url(#punta)" d="M770 343 C813 343, 772 83, 811 83"/>
    <path class="flecha" marker-end="url(#punta)" d="M985 150 C1012 185, 985 232, 985 272"/>
  </g>

  <!-- ============ NOTA ============ -->
  <g>
    <rect x="470" y="414" width="260" height="30" rx="15" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text class="nota" x="600" y="434" text-anchor="middle">¿Error o 0 filas? Corrige y reintenta</text>
  </g>
</svg>
